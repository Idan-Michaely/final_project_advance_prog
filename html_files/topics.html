<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topics</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fafafa; padding: 10px; margin: 0; font-size: 13px; }
    h3 { font-size: 13px; color: #16213e; margin: 0 0 8px 0; }
    #topics-table { width: 100%; }
    #topics-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #topics-table th { background: #4ECDC4; color: white; padding: 5px 8px; }
    #topics-table td { padding: 5px 8px; border: 1px solid #ddd; }
    #topics-table tr:nth-child(even) { background: #f4f4f4; }
    #graph-info { margin-top: 8px; font-size: 12px; color: #555; }
    .no-data { text-align: center; color: #888; padding: 20px; font-style: italic; }
  </style>
</head>
<body>
  <h3>Topics &amp; Values</h3>
  <div id="topics-table"><p class="no-data">Waiting for data…</p></div>
  <div id="graph-info"></div>

  <script>
    function refresh() {
      fetch('/api/update')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          document.getElementById('topics-table').innerHTML = d.topicsHtml;
        })
        .catch(function() {});
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
